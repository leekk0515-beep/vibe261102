<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>오늘의 할일</title>
  <link rel="stylesheet" href="css/style.css">
  <script>
    // 첫 렌더링 전에 저장된 테마를 적용해 깜빡임을 막는다
    try {
      const theme = localStorage.getItem('todayTodo:v1:theme');
      if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
    } catch {}
  </script>
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <div id="storage-warning" class="banner" role="alert" hidden>
    브라우저 저장소를 사용할 수 없어 데이터가 저장되지 않을 수 있어요.
  </div>

  <main class="app">
    <header class="header">
      <div class="header-top">
        <h1>오늘의 할일</h1>
        <button id="theme-toggle" class="icon-btn" type="button" data-mode="system">
          <svg class="icon icon-system" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>
          <svg class="icon icon-light" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="icon icon-dark" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </button>
      </div>
      <p id="today" class="date"></p>
      <div class="progress">
        <div id="progress-bar" class="progress-bar" role="progressbar" aria-label="오늘의 진행률" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
          <div id="progress-fill" class="progress-fill"></div>
        </div>
        <span id="progress-text" class="progress-text"></span>
      </div>
      <p id="celebrate" class="celebrate" hidden>오늘 할일을 모두 끝냈어요! 🎉</p>
    </header>

    <section id="rollover" class="rollover" hidden>
      <p id="rollover-text"></p>
      <div class="rollover-actions">
        <button id="rollover-accept" class="btn btn-primary" type="button">가져오기</button>
        <button id="rollover-decline" class="btn" type="button">새로 시작</button>
      </div>
    </section>

    <form id="add-form" class="add-form" autocomplete="off">
      <label for="new-todo" class="sr-only">새 할일</label>
      <input id="new-todo" class="input" type="text" maxlength="100" placeholder="할 일을 입력하세요..." aria-describedby="char-count" autofocus>
      <div class="add-controls">
        <label for="new-priority" class="sr-only">우선순위</label>
        <select id="new-priority" class="select">
          <option value="high">높음</option>
          <option value="medium" selected>보통</option>
          <option value="low">낮음</option>
        </select>
        <button type="submit" class="btn btn-primary">추가</button>
      </div>
      <span id="char-count" class="char-count">0 / 100</span>
    </form>

    <nav class="filters" aria-label="할일 필터">
      <button type="button" class="filter" data-filter="all" aria-pressed="true">전체 <span class="count">0</span></button>
      <button type="button" class="filter" data-filter="active" aria-pressed="false">진행 중 <span class="count">0</span></button>
      <button type="button" class="filter" data-filter="completed" aria-pressed="false">완료 <span class="count">0</span></button>
    </nav>

    <ul id="todo-list" class="todo-list" aria-label="할일 목록"></ul>
    <p id="empty" class="empty" hidden></p>

    <footer class="footer">
      <span class="hint">순서 변경: 손잡이를 드래그하거나 Alt + ↑/↓</span>
      <button id="clear-completed" class="btn btn-ghost" type="button">완료 항목 지우기</button>
    </footer>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden>
    <span id="toast-msg"></span>
    <button id="toast-undo" class="toast-undo" type="button">실행 취소</button>
  </div>

  <template id="todo-template">
    <li class="todo">
      <span class="drag-handle" title="드래그하여 순서 변경" aria-hidden="true">
        <svg class="icon" viewBox="0 0 24 24"><circle cx="9" cy="6" r="1.2"/><circle cx="15" cy="6" r="1.2"/><circle cx="9" cy="12" r="1.2"/><circle cx="15" cy="12" r="1.2"/><circle cx="9" cy="18" r="1.2"/><circle cx="15" cy="18" r="1.2"/></svg>
      </span>
      <input type="checkbox" class="todo-check" data-action="toggle">
      <span class="todo-text"></span>
      <span class="badge"></span>
      <button type="button" class="icon-btn" data-action="edit">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16v4z"/><path d="M13.5 6.5l4 4"/></svg>
      </button>
      <button type="button" class="icon-btn icon-btn-danger" data-action="remove">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>
      </button>
    </li>
  </template>
</body>
</html>
